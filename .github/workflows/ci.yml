name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://sauvi_test:sauvi_test@localhost:5432/sauvi_test
  DIRECT_URL: postgresql://sauvi_test:sauvi_test@localhost:5432/sauvi_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: test-secret-minimum-32-chars-long-random-string
  JWT_REFRESH_SECRET: test-refresh-secret-32-chars-long-random-string
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 30d
  GOOGLE_CLIENT_ID: test-google-client-id
  GOOGLE_CLIENT_SECRET: test-google-client-secret
  GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
  SUPABASE_URL: https://test-supabase-project.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: test-supabase-service-role-key-minimum-length
  SUPABASE_BUCKET_AVATARS: avatars
  FIREBASE_PROJECT_ID: sauvi-test
  FIREBASE_CLIENT_EMAIL: test@sauvi-test.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"
  MAIL_PROVIDER: dev
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: 587
  SMTP_USER: sauvi.notifications@gmail.com
  SMTP_PASS: test-app-password
  FROM_EMAIL: sauvi.notifications@gmail.com
  FRONTEND_URL: exp://localhost:8081
  NODE_ENV: test

jobs:
  quality:
    name: Biome — Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run Biome CI
        run: npx biome ci .

  test-api:
    name: Tests API — NestJS
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sauvi_test
          POSTGRES_PASSWORD: sauvi_test
          POSTGRES_DB: sauvi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@sauvi/shared

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Push Prisma schema (test DB)
        run: npx prisma db push
        working-directory: apps/api

      - name: Run unit & integration tests
        run: npm run test:ci
        working-directory: apps/api

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: apps/api
        continue-on-error: true

  build-api:
    name: Build — NestJS TypeScript
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run build --workspace=@sauvi/shared
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api

  typecheck-mobile:
    name: TypeCheck — React Native
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run build --workspace=@sauvi/shared
      - run: npx tsc --noEmit
        working-directory: apps/mobile

  build-landing:
    name: Build — Next.js Landing
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run build
        working-directory: apps/landing

