name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release GitHub (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      publish_release:
        description: 'Publier/mettre a jour la release GitHub avec sauvi.apk'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPO_PUBLIC_API_URL: https://sauvi-1.onrender.com/api
      EXPO_PUBLIC_GEOAPIFY_API_KEY: f2e63bbcaf804443a6b85930d9756913

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Optimize Gradle Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Create mobile .env
        run: |
          cat << 'EOF' > apps/mobile/.env
          EXPO_PUBLIC_API_URL=https://sauvi-1.onrender.com/api
          EXPO_PUBLIC_GEOAPIFY_API_KEY=f2e63bbcaf804443a6b85930d9756913
          EOF

      - name: Generate Android Native Project (Expo Prebuild)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: Configure Release Signing with Debug Keystore
        working-directory: apps/mobile/android
        run: |
          # Use debug keystore for release build so it produces a standalone signed APK
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true

      - name: Compile Release APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and copy generated APK
        run: |
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erreur: Aucun fichier APK trouve !"
            exit 1
          fi
          echo "APK trouve a : $APK_PATH"
          cp "$APK_PATH" sauvi.apk
          ls -lh sauvi.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sauvi-apk
          path: sauvi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: ${{ github.event.inputs.publish_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          files: sauvi.apk
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
